name: GoreeCloud import, wheel and runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Import and license integrity
        run: python scripts/verify_import.py
      - name: Compile Python source
        run: python -m compileall -q scrapling goreecloud_web_scraper scripts

  wheel-and-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install build setuptools wheel pytest pytest-asyncio
      - name: Build wheel from reviewed sources
        run: python -m build --wheel --no-isolation
      - name: Install wheel with declared fetcher extras
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[fetchers]"
      - name: Test imported parser and checkpoint behavior
        run: python -m pytest -q -o addopts='' tests/parser tests/spiders/test_checkpoint.py tests/goreecloud/test_checkpoint_safety.py tests/goreecloud/test_loopback_http.py tests/goreecloud/test_browser_privacy.py tests/goreecloud/test_browser_sandbox.py
      - name: Smoke test branded CLI help and version
        run: |
          goreecloud-web-scraper --help > /dev/null
          goreecloud-web-scraper-mcp --help > /dev/null
          goreecloud-web-scraper --version | grep -F 'GoreeCloud Web Scraper, version 0.5.1'
      - name: Test installed GoreeCloud aliases outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/runtime_smoke.py"


  mcp-transport-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build setuptools wheel
      - name: Build distribution wheel
        run: python -m build --wheel --no-isolation
      - name: Install wheel with MCP optional dependencies and test tools
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[ai]" pytest pytest-asyncio pytest-httpbin
          python -m pip check
      - name: Run MCP transport, destination and authenticated owned-loopback tests
        run: python -m pytest -q -o addopts='' tests/goreecloud/test_mcp_guardrails.py tests/goreecloud/test_mcp_destinations.py tests/goreecloud/test_mcp_live_listener.py tests/goreecloud/test_mcp_capacity.py
      - name: Verify inherited MCP auth and metadata regressions
        run: |
          python -m pytest -q -o addopts='' tests/ai/test_ai_mcp.py             -k 'TestStaticTokenVerifier or TestMCPServerAuthentication or test_server_metadata_and_tool_annotations'
      - name: Verify installed MCP entry point
        working-directory: ${{ runner.temp }}
        run: goreecloud-web-scraper-mcp --help > /dev/null

  wheel-provenance-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build setuptools wheel
      - name: Compare twice-built wheel archives at pinned source epoch and validate integrity
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/first" "$work/second"
          python -m build --wheel --no-isolation --outdir "$work/first"
          python -m build --wheel --no-isolation --outdir "$work/second"
          wheel_a="$(find "$work/first" -type f -name '*.whl' -print -quit)"
          wheel_b="$(find "$work/second" -type f -name '*.whl' -print -quit)"
          test -n "$wheel_a" && test -n "$wheel_b"
          test "$(basename "$wheel_a")" = "$(basename "$wheel_b")"
          cmp "$wheel_a" "$wheel_b"
          python scripts/verify_built_wheel.py "$wheel_a"
          python scripts/test_verify_built_wheel.py "$wheel_a"
          digest="$(sha256sum "$wheel_a" | cut -d ' ' -f1)"
          echo "Identical same-environment wheels: $digest"
          printf 'Same-environment wheel SHA-256: `%s` (SOURCE_DATE_EPOCH=`%s`)\n' "$digest" "$SOURCE_DATE_EPOCH" >> "$GITHUB_STEP_SUMMARY"
