name: GoreeCloud import, wheel and runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and license integrity
        run: python scripts/verify_import.py
      - name: Compile Python source
        run: python -m compileall -q scrapling goreecloud_web_scraper scripts

  wheel-and-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install build setuptools wheel pytest pytest-asyncio
      - name: Build wheel from reviewed sources
        run: python -m build --wheel --no-isolation
      - name: Install wheel and minimal offline test dependencies
        run: python -m pip install dist/*.whl "anyio>=4.14" "curl_cffi>=0.16.3"
      - name: Test imported parser and checkpoint behavior
        run: python -m pytest -q -o addopts='' tests/parser tests/spiders/test_checkpoint.py tests/goreecloud/test_checkpoint_safety.py
      - name: Test installed GoreeCloud aliases outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/runtime_smoke.py"
