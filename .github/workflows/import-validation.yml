name: Rebranded import integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python source syntax
        run: python3 -m compileall -q scrapling
      - name: Verify import provenance and licensing
        run: python3 scripts/verify_import.py
