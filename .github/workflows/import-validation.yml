name: GoreeCloud import, wheel and runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Import and license integrity
        run: python scripts/verify_import.py
      - name: Compile Python source
        run: python -m compileall -q scrapling goreecloud_web_scraper scripts

  wheel-and-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install build setuptools wheel pytest pytest-asyncio
      - name: Build wheel from reviewed sources
        run: python -m build --wheel --no-isolation
      - name: Install wheel with declared fetcher extras
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[fetchers]"
      - name: Test imported parser and checkpoint behavior
        run: python -m pytest -q -o addopts='' tests/parser tests/spiders/test_checkpoint.py tests/goreecloud/test_checkpoint_safety.py tests/goreecloud/test_loopback_http.py
      - name: Smoke test branded CLI help and version
        run: |
          goreecloud-web-scraper --help > /dev/null
          goreecloud-web-scraper-mcp --help > /dev/null
          goreecloud-web-scraper --version | grep -F 'GoreeCloud Web Scraper, version 0.5.1'
      - name: Test installed GoreeCloud aliases outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/runtime_smoke.py"
