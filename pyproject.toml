[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-web-scraper"
# Static version instead of a dynamic version so we can get better layer caching while building docker, check the docker file to understand
version = "0.5.1"
description = "GoreeCloud Web Scraper: a BSD-3-Clause rebranded distribution derived from D4Vinci/Scrapling."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
    {name = "Karim Shoair", email = "scrapling@proton.me"}
]
maintainers = [
    {name = "GoreeCloud"}
]
keywords = [
    "web-scraping",
    "scraping",
    "automation",
    "browser-automation",
    "data-extraction",
    "html-parsing",
    "undetectable",
    "playwright",
    "selenium-alternative",
    "web-crawler",
    "browser",
    "crawling",
    "headless",
    "scraper",
    "chrome",
]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=6.1.1",
    "cssselect>=1.5.0",
    "orjson>=3.11.8",
    "tld>=0.13.2",
    "w3lib>=2.4.1",
    "typing_extensions"
]

[project.optional-dependencies]
fetchers = [
    "click>=8.3.0",
    "curl_cffi>=0.16.3",
    "playwright>=1.62.0",
    "patchright>=1.62.1",
    "browserforge>=1.2.4",
    "apify-fingerprint-datapoints>=0.15.0",
    "msgspec>=0.21.1",
    "anyio>=4.14.0",
    "protego>=0.7.0",
]
rag = [
    "markdownify>=1.2.0",
    "goreecloud-web-scraper[fetchers]",
]
ai = [
    "mcp>=2.3.0,<3.0",
    "markdownify>=1.2.0",
    "goreecloud-web-scraper[fetchers]",
]
shell = [
    "IPython>=8.37",  # The last version that supports Python 3.10
    "markdownify>=1.2.0",
    "goreecloud-web-scraper[fetchers]",
]
all = [
    "goreecloud-web-scraper[ai,shell]",
]

[project.urls]
Homepage = "https://github.com/GoreeCloud/web-scraper"
Repository = "https://github.com/GoreeCloud/web-scraper"
"Bug Tracker" = "https://github.com/GoreeCloud/web-scraper/issues"
"Original Upstream" = "https://github.com/D4Vinci/Scrapling"
"Upstream Documentation" = "https://scrapling.readthedocs.io/en/latest/"

[project.scripts]
goreecloud-web-scraper = "scrapling.cli:main"
goreecloud-web-scraper-mcp = "scrapling.cli:mcp"
scrapling = "scrapling.cli:main"
scrapling-mcp = "scrapling.cli:mcp"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapling*", "goreecloud_web_scraper*"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["scrapling"]
ignore = ["tests", "benchmarks.py"]
